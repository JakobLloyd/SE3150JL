name: System Tests

on:
  push:
    branches:
      - main
  workflow_call:

jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install pytest pytest-describe pytest-spec

      - name: Run system tests
        run: python -m pytest TestingSystems --spec
