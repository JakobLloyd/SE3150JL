name: Unit Tests

on:
  push:
    branches:
      - main
  workflow_call:

jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out this repository
        uses: actions/checkout@v4

      - name: Check out the Unit assignment repository
        uses: actions/checkout@v4
        with:
          repository: JakobLloyd/SE3150
          path: TestingUnits

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install pytest pytest-describe pytest-spec

      - name: Run unit tests
        run: python -m pytest TestingUnits --spec
