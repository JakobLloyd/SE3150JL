name: Behavior Tests

on:
  push:
    branches:
      - main
  workflow_call:

jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          install-chromedriver: true

      - name: Install test dependencies
        run: python -m pip install behave behave-webdriver "selenium<4" "urllib3<2"

      - name: Run behavior tests
        run: |
          (cd TestingBehaviors/squirrel_app && python squirrel_server.py) > /tmp/squirrel-api.log 2>&1 &
          api_pid=$!
          python -m http.server 8000 --directory TestingBehaviors/squirrel_app > /tmp/squirrel-web.log 2>&1 &
          web_pid=$!
          trap 'kill "$api_pid" "$web_pid" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/squirrels >/dev/null \
              && curl --fail --silent http://127.0.0.1:8000/ >/dev/null; then
              break
            fi
            sleep 1
          done

          curl --fail --silent http://127.0.0.1:8080/squirrels >/dev/null
          curl --fail --silent http://127.0.0.1:8000/ >/dev/null
          python -m behave TestingBehaviors/squirrel_test/features
          python -m behave TestingBehaviors/swag_labs_test/features
